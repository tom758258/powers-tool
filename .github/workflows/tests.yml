name: Tests

on:
  pull_request:
  push:
    branches:
      - main
      - docs/expand-operator-guidance

permissions:
  contents: read

jobs:
  generate-help-sync:
    name: Temporary Help sync
    if: github.event_name == 'push' && github.ref == 'refs/heads/docs/expand-operator-guidance'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out branch
        uses: actions/checkout@v6
        with:
          ref: docs/expand-operator-guidance

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install uv
        run: python -m pip install --upgrade uv

      - name: Install package
        run: uv sync --python 3.13 --all-extras --locked --link-mode=copy

      - name: Regenerate bundled Help
        run: |
          rm -rf .tmp_tests/generated_help
          ./.venv/bin/python scripts/generate_help.py --output-dir .tmp_tests/generated_help
          cp .tmp_tests/generated_help/cli.html src/powers_tool_cli/help/cli.html
          cp .tmp_tests/generated_help/cli.zh-TW.html src/powers_tool_cli/help/cli.zh-TW.html
          cp .tmp_tests/generated_help/webui.html src/powers_tool_webui/static/help/webui.html
          cp .tmp_tests/generated_help/webui.zh-TW.html src/powers_tool_webui/static/help/webui.zh-TW.html

      - name: Run focused Help checks
        run: >-
          ./.venv/bin/python -m pytest
          tests/tooling/test_help_generator.py
          tests/cli/test_cli_user_guide.py
          tests/webui/test_webui_help.py
          -q -p no:cacheprovider

      - name: Commit generated Help
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/powers_tool_cli/help/cli.html src/powers_tool_cli/help/cli.zh-TW.html
          git add src/powers_tool_webui/static/help/webui.html src/powers_tool_webui/static/help/webui.zh-TW.html
          if git diff --cached --quiet; then
            echo "Generated Help is already synchronized."
          else
            git commit -m "Regenerate bundled Help"
            git push origin HEAD:docs/expand-operator-guidance
          fi

  lint:
    name: Ruff and JavaScript syntax
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Check WebUI JavaScript syntax
        run: |
          set -euo pipefail
          mapfile -t files < <(git ls-files 'src/powers_tool_webui/static/*.js')
          if (( ${#files[@]} == 0 )); then
            echo "::error::No tracked WebUI JavaScript files found."
            exit 1
          fi
          for file in "${files[@]}"; do
            node --check "$file"
          done

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install uv
        run: python -m pip install --upgrade uv

      - name: Install package
        run: uv sync --python 3.13 --all-extras --locked --link-mode=copy

      - name: Run Ruff
        run: ./.venv/bin/python -m ruff check src tests

      - name: Run WebUI Node runtime tests
        run: >-
          ./.venv/bin/python -m pytest
          tests/webui/test_webui_native_module_graph.py
          tests/webui/test_webui_theme.py
          tests/webui/test_webui_i18n.py
          -q -p no:cacheprovider -rs

  pytest-linux:
    name: Linux Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        run: python -m pip install --upgrade uv

      - name: Install package
        run: uv sync --python ${{ matrix.python-version }} --all-extras --locked --link-mode=copy

      - name: Build package
        run: ./.venv/bin/python -m build

      - name: Smoke imports and commands
        run: |
          ./.venv/bin/python -c "import powers_tool_core; import powers_tool_cli; import powers_tool_webui"
          ./.venv/bin/powers-tool --help
          ./.venv/bin/powers-tool-webui --help
          ./.venv/bin/powers-tool-webui-launcher --version

      - name: Run fast tests
        run: ./.venv/bin/python -m pytest tests -q -p no:cacheprovider --ignore=tests/cli/test_cli_wrappers.py --ignore=tests/packaging/test_release_acceptance.py

  pytest-windows:
    name: Windows Python ${{ matrix.python-version }}
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.12"
          - "3.13"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up Node.js
        if: matrix.python-version == '3.13'
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install uv
        run: python -m pip install --upgrade uv

      - name: Install package
        run: uv sync --python ${{ matrix.python-version }} --all-extras --locked --link-mode=copy

      - name: Build package
        run: .\.venv\Scripts\python.exe -m build

      - name: Smoke imports and commands
        run: |
          .\.venv\Scripts\python.exe -c "import powers_tool_core; import powers_tool_cli; import powers_tool_webui"
          .\.venv\Scripts\powers-tool.exe --help
          .\.venv\Scripts\powers-tool-webui.exe --help
          .\.venv\Scripts\powers-tool-webui-launcher.exe --version

      - name: Build Desktop directory
        if: matrix.python-version == '3.13'
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\scripts\build_desktop.ps1

      - name: Run fast tests
        run: .\.venv\Scripts\python.exe -m pytest tests -q -p no:cacheprovider --ignore=tests\cli\test_cli_wrappers.py --ignore=tests\packaging\test_release_acceptance.py

  wrapper-contracts:
    name: Windows wrapper contracts
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install uv
        run: python -m pip install --upgrade uv

      - name: Install package
        run: uv sync --python 3.13 --all-extras --locked --link-mode=copy

      - name: Run wrapper contract tests
        run: .\.venv\Scripts\python.exe -m pytest tests\cli\test_cli_wrappers.py -q -p no:cacheprovider
