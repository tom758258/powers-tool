name: Tests

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality-webui:
    name: Code quality & WebUI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Install uv
        run: python -m pip install --upgrade uv
      - name: Install locked dependencies
        run: uv sync --python 3.13 --all-extras --locked --link-mode=copy
      - name: Check tracked text hygiene
        run: python scripts/check_text_hygiene.py
      - name: Check committed whitespace
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            base=$(git merge-base origin/main HEAD)
            test -n "$base" || { echo "::error::No trusted merge base"; exit 1; }
            git diff --check "$base" HEAD
          else
            python scripts/check_changed_whitespace.py
          fi
      - name: Run Ruff
        run: ./.venv/bin/python -m ruff check src tests
      - name: Check tracked WebUI JavaScript
        run: |
          set -euo pipefail
          mapfile -t files < <(git ls-files 'src/powers_tool_webui/static/*.js')
          if (( ${#files[@]} == 0 )); then echo '::error::No WebUI JS files'; exit 1; fi
          for file in "${files[@]}"; do node --check "$file"; done
      - name: Prepare pytest temp root
        run: mkdir -p .tmp_tests
      - name: Run Node runtime tests (Node required)
        run: |
          node --version
          ./.venv/bin/python -m pytest -q -rs --strict-markers \
            -m "frontend_node and not hardware" \
            --basetemp .tmp_tests/ci-quality-node tests/webui
      - name: Verify change detection contracts
        run: >-
          ./.venv/bin/python -m pytest -q
          --basetemp .tmp_tests/ci-change-detection
          tests/tooling/test_ci_change_detection.py

  pytest-linux:
    name: Linux Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        run: python -m pip install --upgrade uv
      - name: Install locked dependencies
        run: uv sync --python ${{ matrix.python-version }} --all-extras --locked --link-mode=copy
      - name: Build distributions
        run: ./.venv/bin/python -m build
      - name: Import and installed entry-point smoke
        run: |
          ./.venv/bin/python -c "import powers_tool_core, powers_tool_cli, powers_tool_webui"
          ./.venv/bin/powers-tool --help
          ./.venv/bin/powers-tool-webui --help
          ./.venv/bin/powers-tool-webui-launcher --version
      - name: Prepare pytest temp root
        run: mkdir -p .tmp_tests
      - name: Primary hardware-free suite
        if: matrix.python-version == '3.13'
        run: >-
          ./.venv/bin/python -m pytest -q -rs --strict-markers
          -m "not hardware and not windows_powershell and not frontend_node"
          --basetemp .tmp_tests/ci-linux-py3.13 tests
      - name: Cross-version compatibility and safety contracts
        if: matrix.python-version != '3.13'
        run: >-
          ./.venv/bin/python -m pytest -q -rs --strict-markers
          -m "not hardware and not windows_powershell and not frontend_node"
          --basetemp .tmp_tests/ci-linux-compat
          tests/core/test_identity.py
          tests/core/test_capabilities.py
          tests/core/test_live_support_policy_enforcement.py
          tests/core/test_admission_materialization.py
          tests/core/test_safety.py
          tests/core/test_stop_cleanup.py
          tests/core/test_protection.py
          tests/core/test_transport.py
          tests/core/test_setpoint_ranges.py
          tests/core/test_sequence_core.py
          tests/core/test_ramp_list_core.py
          tests/cli/test_cli_json_contract.py
          tests/cli/test_cli_validation_policy.py
          tests/cli/test_cli_core_boundaries.py
          tests/cli/test_worker_command_taxonomy.py
          tests/cli/test_worker.py
          tests/webui/test_webui_api_contract.py
          tests/packaging/test_packaging_identity.py

  pytest-windows:
    name: Windows Python ${{ matrix.python-version }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        run: python -m pip install --upgrade uv
      - name: Install locked dependencies
        run: uv sync --python ${{ matrix.python-version }} --all-extras --locked --link-mode=copy
      - name: Build distributions
        run: .\.venv\Scripts\python.exe -m build
      - name: Import and installed entry-point smoke
        run: |
          .\.venv\Scripts\python.exe -c "import powers_tool_core, powers_tool_cli, powers_tool_webui"
          .\.venv\Scripts\powers-tool.exe --help
          .\.venv\Scripts\powers-tool-webui.exe --help
          .\.venv\Scripts\powers-tool-webui-launcher.exe --version
      - name: Prepare pytest temp root
        run: New-Item -ItemType Directory -Force .tmp_tests | Out-Null
      - name: Windows platform and critical safety contracts
        run: >-
          .\.venv\Scripts\python.exe -m pytest -q -rs --strict-markers
          -m "not hardware and not windows_powershell and not frontend_node"
          --basetemp .tmp_tests/ci-windows-compat
          tests/core/test_identity.py
          tests/core/test_live_support_policy_enforcement.py
          tests/core/test_safety.py
          tests/core/test_stop_cleanup.py
          tests/core/test_transport.py
          tests/cli/test_cli_json_contract.py
          tests/cli/test_cli_core_boundaries.py
          tests/cli/test_worker_command_taxonomy.py
          tests/cli/test_worker.py
          tests/webui/test_desktop_host.py
          tests/webui/test_launcher.py
          tests/webui/test_job_manager_shutdown.py
          tests/packaging/test_windows_bundle.py
          tests/packaging/test_packaging_identity.py

  detect-validation-changes:
    name: Detect validation changes
    runs-on: ubuntu-latest
    outputs:
      validation: ${{ steps.detect.outputs.validation }}
      packaging: ${{ steps.detect.outputs.packaging }}
      release-layout: ${{ steps.detect.outputs.release-layout }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Classify changes (fail closed)
        id: detect
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          GITHUB_SHA: ${{ github.sha }}
        run: python scripts/ci_change_detection.py

  windows-validation:
    name: Windows PowerShell validation contracts
    needs: detect-validation-changes
    if: needs.detect-validation-changes.outputs.validation == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Require Windows PowerShell
        run: |
          if (-not (Get-Command powershell.exe -ErrorAction SilentlyContinue)) { throw "Windows PowerShell is required" }
      - name: Install uv
        run: python -m pip install --upgrade uv
      - name: Install locked dependencies
        run: uv sync --python 3.13 --all-extras --locked --link-mode=copy
      - name: Prepare pytest temp root
        run: New-Item -ItemType Directory -Force .tmp_tests | Out-Null
      - name: Wrapper, preflight and script contracts (no real hardware)
        run: >-
          .\.venv\Scripts\python.exe -m pytest -q -rs --strict-markers
          -m "windows_powershell and not hardware"
          --basetemp .tmp_tests/ci-windows-validation tests

  windows-packaging-smoke:
    name: Windows real packaging smoke
    needs: detect-validation-changes
    if: needs.detect-validation-changes.outputs.packaging == 'true'
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          architecture: x64
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Install uv
        run: python -m pip install --upgrade uv
      - name: Install locked dependencies
        run: uv sync --python 3.13 --all-extras --locked --link-mode=copy
      - name: Build Desktop once
        if: needs.detect-validation-changes.outputs.release-layout != 'true'
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\scripts\build_desktop.ps1
      - name: Build release layout once
        if: needs.detect-validation-changes.outputs.release-layout == 'true'
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\scripts\build_release.ps1
      - name: Inspect real outputs and smoke executables
        shell: pwsh
        run: |
          $arguments = @('scripts/ci_packaging_smoke.py')
          if ('${{ needs.detect-validation-changes.outputs.release-layout }}' -eq 'true') {
            $arguments += '--release-layout'
          }
          & .\.venv\Scripts\python.exe @arguments
          if ($LASTEXITCODE -ne 0) { throw "Packaging smoke failed ($LASTEXITCODE)" }
